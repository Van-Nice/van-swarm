[package]
name        = "vanswarm-memory"
description = "Three-tier cognitive memory subsystem for VanSwarm agents"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true

[features]
default = []
# Persistent episodic memory via libsql (file or :memory:).
libsql = ["dep:libsql"]

[dependencies]
vanswarm-core.workspace = true
tokio.workspace           = true
async-trait.workspace     = true
serde.workspace           = true
serde_json.workspace      = true
thiserror.workspace       = true
tracing.workspace         = true
uuid.workspace            = true
chrono.workspace          = true
libsql = { version = "0.9", optional = true, default-features = false, features = ["core"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
