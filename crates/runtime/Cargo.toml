[package]
name        = "openswarm-runtime"
description = "Wasmtime-based WASM sandbox runtime for OpenSwarm tool isolation"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true

[features]
default = ["wasm", "scripting"]
# Gate the heavy wasmtime dependency behind a feature flag so it's opt-in.
wasm      = ["dep:wasmtime", "dep:wasmtime-wasi"]
# Rhai embedded scripting (§7).
scripting = ["dep:rhai"]
# WASM-to-MCP bridge (§6): bind guest mcp/call_tool to host McpClient.
mcp-bridge = ["dep:openswarm-mcp"]

[dependencies]
openswarm-core.workspace = true
tokio.workspace           = true
async-trait.workspace     = true
serde.workspace           = true
serde_json.workspace      = true
thiserror.workspace       = true
tracing.workspace         = true
# Optional heavy deps – only compiled when "wasm" feature is active.
wasmtime      = { version = "26", optional = true }
wasmtime-wasi = { version = "26", optional = true }
# Rhai embedded scripting engine (§7).
rhai             = { version = "1", optional = true }
# MCP client for WASM-to-MCP bridge (§6).
openswarm-mcp   = { path = "../mcp", optional = true }

[dev-dependencies]
tokio     = { workspace = true, features = ["test-util"] }
criterion = { workspace = true }

[[bench]]
name = "cold_start"
harness = false
required-features = ["wasm"]
